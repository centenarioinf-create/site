<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informática Valinhos</title>
    <style>
        /* Reset e estilo base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f8faff 0%, #eef2f9 100%);
            color: #1e2b3c;
            padding: 1.5rem;
        }

        /* Container central com efeito de cartão */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 780px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            box-shadow: 
                0 25px 40px -12px rgba(0, 20, 40, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: box-shadow 0.3s ease;
        }

        /* Logo responsiva e nítida */
        .logo {
            display: block;
            max-width: 100%;
            height: auto;
            width: 180px;          /* tamanho base suave */
            border-radius: 1.2rem;  /* leve arredondamento elegante */
            box-shadow: 0 12px 25px -8px rgba(0, 35, 70, 0.2);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            margin-bottom: 1.8rem;
        }

        .logo:hover {
            transform: scale(1.02);
            box-shadow: 0 18px 30px -10px rgba(0, 60, 120, 0.3);
        }

        /* Título principal */
        h1 {
            font-size: clamp(2rem, 8vw, 3.8rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #0a1e2f;
            background: linear-gradient(135deg, #1d2f44, #0a1e2f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            margin: 0.25rem 0 0.5rem;
            word-break: break-word;
        }

        /* Ajustes finos para telas pequenas */
        @media (max-width: 480px) {
            .hero {
                padding: 2rem 1.2rem;
                border-radius: 2rem;
            }

            .logo {
                width: 130px;
                border-radius: 0.9rem;
                margin-bottom: 1.4rem;
            }

            h1 {
                font-size: clamp(1.8rem, 9vw, 2.8rem);
            }
        }

        /* Suporte a telas muito grandes (mantém proporção elegante) */
        @media (min-width: 1200px) {
            .logo {
                width: 210px;
            }
            .hero {
                padding: 3rem 2.5rem;
            }
        }

        /* Acessibilidade: modo escuro suave (opcional, mas mantém elegância) */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(145deg, #121a24 0%, #0b1219 100%);
            }
            .hero {
                background: rgba(20, 30, 45, 0.7);
                box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            }
            h1 {
                background: linear-gradient(135deg, #e5efff, #b0c8e0);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            }
            .logo {
                box-shadow: 0 12px 25px -8px rgba(0, 0, 0, 0.7);
            }
        }
    </style>
</head>
<body>
    <main class="hero">
        <!-- Logo com alt descritivo -->
        <img 
            src="logo.jpg" 
            alt="Logo Informática Valinhos" 
            class="logo"
            width="180"
            height="180"
        >
        <h1>Informática Valinhos</h1>
    </main>
</body>
</html>
