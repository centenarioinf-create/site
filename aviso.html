<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main id="conteudo">
    <h2>Aviso Importante</h2>
    <p>
      Este é o conteúdo que aparece no modal automático ao entrar no site.
      Você pode editar este arquivo (<strong>aviso.html</strong>) livremente.
      O script busca o conteúdo dentro da tag <code>&lt;main&gt;</code> e o exibe no modal.
    </p>
    <p>
      Para desativar o modal, altere <code>modalAtivo: false</code> no <code>script.js</code>.
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
